<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Vision & Execution Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bricolage+Grotesque:opsz,wght@12..60,400;12..60,600;12..60,700;12..60,800&display=swap" rel="stylesheet"/>
<style>
/* ============================================================
   TOKENS — LIGHT (default)
   ============================================================ */
:root{
  --bg:#f0ece4;
  --surface:#faf8f3;
  --card:#ffffff;
  --ink:#1a1a2e;
  --ink2:#3d3d5c;
  --ink3:#7b7b9a;
  --ink4:#b0afc4;
  --border:rgba(0,0,0,0.08);
  --border-bright:rgba(0,0,0,0.15);
  --accent:#f5a623;
  --accent-dim:rgba(245,166,35,0.12);
  --accent-glow:rgba(245,166,35,0.3);
  --green:#00c896;
  --green-dim:rgba(0,200,150,0.12);
  --blue:#3d7fff;
  --blue-dim:rgba(61,127,255,0.1);
  --red:#ff3d6b;
  --red-dim:rgba(255,61,107,0.1);
  --purple:#9b7fe8;
  --purple-dim:rgba(155,127,232,0.1);
  --orange:#ff6b35;
  --r:16px; --r-sm:10px; --r-xs:7px;
  --sh:0 8px 32px rgba(0,0,0,0.10);
  --sh3d:0 12px 48px rgba(0,0,0,0.13),0 4px 14px rgba(0,0,0,0.08),inset 0 1px 0 rgba(255,255,255,0.9);
  --sh3d-h:0 32px 80px rgba(0,0,0,0.20),0 12px 28px rgba(0,0,0,0.10),inset 0 1px 0 #fff;
  --font-d:'Bebas Neue',sans-serif;
  --font-b:'Bricolage Grotesque',sans-serif;
  --tr:all .2s ease;
}

/* ============================================================
   TOKENS — DARK
   ============================================================ */
[data-theme="dark"]{
  --bg:#0d0f14;
  --surface:#13161e;
  --card:#181c27;
  --ink:#e8ecf5;
  --ink2:#a8b0cc;
  --ink3:#5a6180;
  --ink4:#363d55;
  --border:rgba(255,255,255,0.07);
  --border-bright:rgba(255,255,255,0.13);
  --accent:#f5a623;
  --accent-dim:rgba(245,166,35,0.14);
  --accent-glow:rgba(245,166,35,0.25);
  --green:#3dd68c;
  --green-dim:rgba(61,214,140,0.12);
  --blue:#4d9fff;
  --blue-dim:rgba(77,159,255,0.12);
  --red:#ff5f7a;
  --red-dim:rgba(255,95,122,0.12);
  --purple:#b09af0;
  --purple-dim:rgba(176,154,240,0.12);
  --sh:0 8px 32px rgba(0,0,0,0.4);
  --sh3d:0 12px 48px rgba(0,0,0,0.5),0 4px 14px rgba(0,0,0,0.3),inset 0 1px 0 rgba(255,255,255,0.05);
  --sh3d-h:0 32px 80px rgba(0,0,0,0.6),0 12px 28px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.08);
}
/* smooth theme transition on everything except animations */
body,body *:not([class*="animation"]):not(circle){
  transition:background-color .3s ease,border-color .3s ease,color .3s ease,box-shadow .3s ease !important;
}

/* ============================================================
   RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:var(--font-b);background:var(--bg);color:var(--ink);
  min-height:100vh;overflow-x:hidden;
  background-image:
    radial-gradient(circle at 12% 18%,rgba(245,166,35,.07) 0%,transparent 50%),
    radial-gradient(circle at 88% 82%,rgba(0,200,150,.05) 0%,transparent 50%);
}
[data-theme="dark"] body,body[data-theme="dark"]{
  background-image:
    radial-gradient(circle at 12% 18%,rgba(245,166,35,.04) 0%,transparent 50%),
    radial-gradient(circle at 88% 82%,rgba(61,214,140,.03) 0%,transparent 50%);
}
button{cursor:pointer;font-family:var(--font-b);border:none;background:none}
input,textarea,select{font-family:var(--font-b)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--ink4);border-radius:3px}

/* ---- Theme toggle pill ---- */
.theme-pill{
  display:flex;align-items:center;gap:6px;padding:6px 13px;border-radius:20px;
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);
  color:rgba(255,255,255,.8);font-size:12px;font-weight:800;
  cursor:pointer;transition:var(--tr);user-select:none;letter-spacing:.3px;
}
.theme-pill:hover{background:rgba(255,255,255,.2);color:#fff}
.theme-pill .tp-icon{font-size:14px;transition:transform .5s ease}

/* ---- Admin lock badge ---- */
.admin-badge{
  display:flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;
  font-size:12px;font-weight:800;cursor:pointer;transition:var(--tr);letter-spacing:.3px;
}
.admin-badge.locked{background:rgba(255,95,122,.12);border:1px solid rgba(255,95,122,.25);color:#ff9db0}
.admin-badge.locked:hover{background:rgba(255,95,122,.22)}
.admin-badge.unlocked{background:rgba(61,214,140,.12);border:1px solid rgba(61,214,140,.25);color:#3dd68c}
.admin-badge.unlocked:hover{background:rgba(61,214,140,.22)}

/* ---- Admin PIN modal ---- */
.pin-modal{
  background:var(--card);border-radius:var(--r);padding:32px;
  width:100%;max-width:340px;text-align:center;
  box-shadow:0 40px 80px rgba(0,0,0,.28);
  animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);
  border-top:4px solid var(--accent);
}
.pin-title{font-family:var(--font-d);font-size:28px;letter-spacing:2px;color:var(--ink);margin-bottom:4px}
.pin-sub{font-size:12px;font-weight:700;color:var(--ink3);margin-bottom:22px;line-height:1.5}
.pin-dots{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
.pin-dot{width:14px;height:14px;border-radius:50%;background:var(--border);border:2px solid var(--border-bright);transition:all .2s}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px var(--accent-glow)}
.pin-dot.err{background:var(--red);border-color:var(--red);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.pin-key{
  aspect-ratio:1;border-radius:12px;font-family:var(--font-d);font-size:22px;letter-spacing:1px;
  background:var(--surface);border:1.5px solid var(--border);color:var(--ink);transition:all .15s;
}
.pin-key:hover{background:var(--accent-dim);border-color:var(--accent);transform:scale(1.06)}
.pin-key:active{transform:scale(.95)}
.pin-key.pin-del,.pin-key.pin-clr{font-size:14px;font-weight:800}
.pin-err-msg{font-size:12px;font-weight:800;color:var(--red);min-height:18px}
.pin-hint{font-size:11px;font-weight:700;color:var(--ink4);margin-top:10px}

/* ---- Milestone undo bar ---- */
.undo-bar{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(72px);
  background:var(--ink);color:#fff;border-radius:var(--r-sm);
  padding:11px 16px;display:flex;align-items:center;gap:14px;
  box-shadow:0 16px 48px rgba(0,0,0,.25);z-index:700;
  font-size:13px;font-weight:700;white-space:nowrap;
  transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s ease;
  opacity:0;pointer-events:none;border-left:4px solid var(--accent);
}
.undo-bar.show{transform:translateX(-50%) translateY(0);opacity:1;pointer-events:all}
.undo-btn{
  padding:5px 13px;border-radius:7px;background:var(--accent);color:#000;
  font-size:12px;font-weight:800;transition:var(--tr);
}
.undo-btn:hover{background:#ffb733;transform:scale(1.05)}

/* ============================================================
   HEADER
   ============================================================ */
.hdr{
  background:var(--ink);border-bottom:4px solid var(--accent);
  padding:0 28px;position:sticky;top:0;z-index:300;
}
.hdr-in{
  max-width:1440px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;
  height:66px;gap:16px;flex-wrap:wrap;
}
.logo{display:flex;align-items:center;gap:12px}
.logo-icon{
  width:40px;height:40px;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#ff8c00);
  display:flex;align-items:center;justify-content:center;font-size:18px;
  box-shadow:0 0 20px var(--accent-glow);
}
.logo-t{font-family:var(--font-d);font-size:24px;letter-spacing:3px;color:#fff;line-height:1}
.logo-s{font-size:10px;font-weight:800;color:rgba(255,255,255,.4);letter-spacing:2.5px;text-transform:uppercase;margin-top:1px}
.hdr-acts{display:flex;align-items:center;gap:8px}
.btn-ico{
  width:38px;height:38px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center;
  font-size:15px;transition:var(--tr);
}
.btn-ico:hover{background:rgba(255,255,255,.18);color:#fff;border-color:rgba(255,255,255,.3)}
.btn-prime{
  padding:9px 18px;border-radius:var(--r-sm);
  background:var(--accent);color:#000;font-weight:800;font-size:13px;letter-spacing:.5px;
  transition:var(--tr);display:flex;align-items:center;gap:6px;
  box-shadow:0 4px 16px var(--accent-glow);
}
.btn-prime:hover{background:#ffb733;transform:translateY(-2px);box-shadow:0 8px 24px var(--accent-glow)}

/* ============================================================
   SUMMARY BAR
   ============================================================ */
.sum-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px}
.sum-in{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sstat{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:13px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);transition:var(--tr);
}
.sstat:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.sstat-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ss-tot .sstat-ico{background:var(--blue-dim)} .ss-wip .sstat-ico{background:var(--purple-dim)}
.ss-don .sstat-ico{background:var(--green-dim)} .ss-avg .sstat-ico{background:var(--accent-dim)}
.sstat-lbl{font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px}
.sstat-val{font-family:var(--font-d);font-size:26px;color:var(--ink);letter-spacing:1px;line-height:1}
.ov-bar-row{max-width:1440px;margin:10px auto 0}
.ov-bar-bg{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.ov-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));border-radius:3px;transition:width .6s ease}

/* ============================================================
   CONTROLS
   ============================================================ */
.ctrl{max-width:1440px;margin:0 auto;padding:20px 28px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srch-w{flex:1;min-width:200px;position:relative}
.srch-ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:14px;pointer-events:none}
.srch-inp{
  width:100%;padding:10px 12px 10px 38px;background:var(--card);
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  color:var(--ink);font-size:14px;font-weight:600;outline:none;transition:var(--tr);
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.srch-inp::placeholder{color:var(--ink4)} .srch-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.flt{
  padding:10px 14px;background:var(--card);border:1.5px solid var(--border);
  border-radius:var(--r-sm);color:var(--ink);font-size:13px;font-weight:700;
  outline:none;cursor:pointer;transition:var(--tr);box-shadow:0 2px 8px rgba(0,0,0,.05);
}
.flt:focus{border-color:var(--accent)}

/* ============================================================
   TABS
   ============================================================ */
.tabs-w{max-width:1440px;margin:0 auto;padding:18px 28px 0;display:flex;gap:4px;border-bottom:2px solid var(--border);overflow-x:auto}
.tab-btn{
  padding:10px 22px;border-radius:var(--r-sm) var(--r-sm) 0 0;
  font-size:13px;font-weight:800;letter-spacing:.3px;color:var(--ink3);
  background:transparent;border:1.5px solid transparent;border-bottom:none;
  transition:var(--tr);white-space:nowrap;position:relative;bottom:-2px;
  display:flex;align-items:center;gap:8px;
}
.tab-btn:hover{color:var(--ink);background:var(--card);border-color:var(--border)}
.tab-btn.active{color:var(--accent);background:var(--card);border-color:var(--border);border-bottom-color:var(--card)}
.tab-cnt{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:20px;height:20px;border-radius:10px;font-size:11px;font-weight:800;padding:0 5px;
  background:var(--accent-dim);color:var(--accent);
}
.tab-btn.active .tab-cnt{background:var(--accent);color:#000}

/* ============================================================
   CARDS GRID
   ============================================================ */
.tab-content{display:none}.tab-content.active{display:block}
.cards-sec{max-width:1440px;margin:0 auto;padding:28px}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:22px}
.empty-st{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--ink3);font-size:14px;font-weight:700}
.empty-st .ei{font-size:44px;margin-bottom:14px}

/* ============================================================
   VISION CARD (grid tile — compact, 3D)
   ============================================================ */
.vc{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);
  box-shadow:var(--sh3d);overflow:hidden;display:flex;flex-direction:column;
  animation:cardIn .35s cubic-bezier(.34,1.56,.64,1);
  transition:transform .35s ease,box-shadow .35s ease;
  transform-style:preserve-3d;position:relative;
  cursor:pointer;will-change:transform;
}
.vc::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:1;border-radius:var(--r);
  background:linear-gradient(135deg,rgba(255,255,255,.55) 0%,transparent 55%);
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.96)}to{opacity:1;transform:none}}
.vc:hover{box-shadow:var(--sh3d-h)}

/* priority strip */
.vc-strip{height:4px;flex-shrink:0;position:relative;z-index:2}
.p-high .vc-strip{background:linear-gradient(90deg,var(--red),#ff8c00)}
.p-med  .vc-strip{background:linear-gradient(90deg,var(--accent),#ffe033)}
.p-low  .vc-strip{background:linear-gradient(90deg,var(--blue),var(--purple))}

.vc-body{padding:18px 18px 16px;flex:1;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}

/* card top row */
.vc-top{display:flex;align-items:flex-start;gap:10px}
.vc-info{flex:1;min-width:0}
.vc-title{font-family:var(--font-d);font-size:21px;letter-spacing:1.5px;color:var(--ink);line-height:1.1;margin-bottom:4px}
.vc-desc{font-size:12px;font-weight:600;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vc-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:800;letter-spacing:.3px;box-shadow:0 2px 5px rgba(0,0,0,.07)}
.bs-ns{background:rgba(0,0,0,.06);color:var(--ink3)}
.bs-ip{background:var(--accent-dim);color:#8a5e0a;border:1px solid rgba(245,166,35,.3)}
.bs-cp{background:var(--green-dim);color:#007a5c;border:1px solid rgba(0,200,150,.3)}
.bp-hi{background:var(--red-dim);color:#c00030}
.bp-md{background:var(--accent-dim);color:#8a5e0a}
.bp-lo{background:var(--blue-dim);color:#1a4fa0}

/* ring in tile */
.vc-ring-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px}
.vc-ring-cont{position:relative;width:68px;height:68px}
.vc-ring-svg{transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(0,0,0,.07);stroke-width:6}
.ring-fg{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.34,1.56,.64,1)}
.vc-ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.vc-ring-pct{font-family:var(--font-d);font-size:18px;color:var(--ink);letter-spacing:1px;line-height:1}
.vc-ring-lbl{font-size:7px;font-weight:800;color:var(--ink3);letter-spacing:1px;text-transform:uppercase}

/* tile progress bar */
.vc-bar-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.vc-bar-lbl{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px}
.vc-bar-val{font-family:var(--font-d);font-size:17px;color:var(--ink);letter-spacing:1px}
.vc-bar-bg{height:7px;background:rgba(0,0,0,.07);border-radius:4px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.07)}
.vc-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .4s ease;position:relative}
.vc-bar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:7px;background:rgba(255,255,255,.45);border-radius:4px}

/* tile footer */
.vc-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border);margin-top:auto}
.vc-meta-chips{display:flex;gap:5px;flex-wrap:wrap}
.vc-chip{font-size:10px;font-weight:800;padding:3px 8px;border-radius:10px;background:rgba(0,0,0,.05);color:var(--ink3)}
.vc-open-btn{
  display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:var(--r-xs);
  background:var(--ink);color:#fff;font-size:11px;font-weight:800;
  transition:var(--tr);box-shadow:0 3px 8px rgba(0,0,0,.15);
}
.vc-open-btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(0,0,0,.2)}

/* ============================================================
   DETAIL PANEL (slide-in drawer)
   ============================================================ */
.dp-overlay{
  position:fixed;inset:0;background:rgba(15,15,30,.5);
  backdrop-filter:blur(10px);z-index:400;opacity:0;pointer-events:none;transition:opacity .3s ease;
}
.dp-overlay.open{opacity:1;pointer-events:all}
.dp{
  position:fixed;top:0;right:0;bottom:0;
  width:min(820px,100vw);background:var(--surface);
  box-shadow:-24px 0 80px rgba(0,0,0,.2);
  z-index:401;transform:translateX(100%);
  transition:transform .38s cubic-bezier(.32,0,.67,0);
  display:flex;flex-direction:column;overflow:hidden;
}
.dp.open{transform:none;transition-timing-function:cubic-bezier(.33,1,.68,1)}

/* panel header */
.dp-hdr{
  background:var(--ink);padding:0 24px;flex-shrink:0;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  min-height:64px;
}
.dp-hdr-left{flex:1;min-width:0}
.dp-title{font-family:var(--font-d);font-size:26px;letter-spacing:2px;color:#fff;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-sub{font-size:11px;font-weight:700;color:rgba(255,255,255,.45);margin-top:2px;letter-spacing:.5px}
.dp-hdr-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.dp-close{
  width:36px;height:36px;border-radius:var(--r-xs);background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;font-size:16px;transition:var(--tr);
}
.dp-close:hover{background:rgba(255,255,255,.18);color:#fff}
.dp-edit-btn,.dp-del-btn{
  display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:var(--r-xs);
  font-size:12px;font-weight:800;transition:var(--tr);
}
.dp-edit-btn{background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);border:1px solid rgba(255,255,255,.15)}
.dp-edit-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.dp-del-btn{background:rgba(255,61,107,.12);color:#ff8fa7;border:1px solid rgba(255,61,107,.2)}
.dp-del-btn:hover{background:var(--red);color:#fff}

/* panel nav tabs */
.dp-nav{
  background:var(--card);border-bottom:2px solid var(--border);
  padding:0 24px;display:flex;gap:0;flex-shrink:0;overflow-x:auto;
}
.dp-tab{
  padding:12px 18px;font-size:12px;font-weight:800;color:var(--ink3);
  border-bottom:3px solid transparent;white-space:nowrap;transition:var(--tr);
  display:flex;align-items:center;gap:6px;position:relative;bottom:-2px;
}
.dp-tab:hover{color:var(--ink)}
.dp-tab.act{color:var(--accent);border-bottom-color:var(--accent)}

/* panel body */
.dp-body{flex:1;overflow-y:auto;padding:24px}
.dp-pane{display:none}.dp-pane.act{display:block}

/* ---- OVERVIEW pane ---- */
.dp-ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.dp-stat-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:16px;box-shadow:0 3px 10px rgba(0,0,0,.06);
  display:flex;flex-direction:column;gap:4px;
}
.dp-stat-card-label{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px}
.dp-stat-card-val{font-family:var(--font-d);font-size:28px;color:var(--ink);letter-spacing:1px;line-height:1}
.dp-progress-hero{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:16px;box-shadow:0 3px 10px rgba(0,0,0,.06);margin-bottom:16px}
.dp-prog-row{display:flex;align-items:center;gap:16px}
.dp-ring-big{position:relative;width:96px;height:96px;flex-shrink:0}
.dp-ring-svg{transform:rotate(-90deg)}
.dp-ring-bg{fill:none;stroke:rgba(0,0,0,.07);stroke-width:8}
.dp-ring-fill{fill:none;stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.34,1.56,.64,1)}
.dp-ring-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dp-ring-pct{font-family:var(--font-d);font-size:26px;color:var(--ink);letter-spacing:1px;line-height:1}
.dp-ring-lbl{font-size:9px;font-weight:800;color:var(--ink3);letter-spacing:1px;text-transform:uppercase}
.dp-prog-info{flex:1}
.dp-prog-label{font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.dp-prog-val{font-family:var(--font-d);font-size:22px;color:var(--ink);letter-spacing:1px;margin-bottom:8px}
.dp-bar-bg{height:10px;background:rgba(0,0,0,.07);border-radius:5px;overflow:hidden;margin-bottom:10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.dp-bar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .5s ease;position:relative}
.dp-bar-fill::after{content:'';position:absolute;right:0;top:0;bottom:0;width:10px;background:rgba(255,255,255,.45);border-radius:5px}
.dp-slider{width:100%;-webkit-appearance:none;height:5px;border-radius:3px;background:rgba(0,0,0,.1);outline:none;cursor:pointer}
.dp-slider::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);cursor:pointer;box-shadow:0 2px 8px var(--accent-glow);transition:transform .2s}
.dp-slider::-webkit-slider-thumb:hover{transform:scale(1.3)}

/* status/priority editors in overview */
.dp-editors{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.dp-editor label{display:block;font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.dp-select{
  width:100%;padding:9px 12px;background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--r-xs);color:var(--ink);font-size:13px;font-weight:700;outline:none;transition:var(--tr);
}
.dp-select:focus{border-color:var(--accent)}

/* notes in overview */
.dp-notes-ta{
  width:100%;min-height:90px;padding:10px 13px;background:var(--card);
  border:1.5px solid var(--border);border-radius:var(--r-sm);
  color:var(--ink);font-size:13px;font-weight:600;line-height:1.6;
  outline:none;resize:vertical;transition:var(--tr);font-family:var(--font-b);margin-top:6px;
}
.dp-notes-ta:focus{border-color:var(--accent)}

/* ---- SECTION label ---- */
.sec-lbl{font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec-lbl::after{content:'';flex:1;height:1px;background:var(--border)}

/* ---- EXECUTION pane (sections + cost) ---- */
.ex-section{margin-bottom:14px}
.ex-sec-head{
  display:flex;align-items:center;justify-content:space-between;
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:10px 14px;cursor:pointer;user-select:none;transition:var(--tr);
}
.ex-sec-head:hover{border-color:var(--border-bright);background:#f7f5f0}
.ex-sec-head.open{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.ex-sec-left{display:flex;align-items:center;gap:9px}
.ex-sec-ico{font-size:14px;width:22px;text-align:center}
.ex-sec-title{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.3px}
.ex-sec-cnt{font-size:11px;font-weight:800;color:var(--ink4);padding:2px 7px;background:rgba(0,0,0,.05);border-radius:10px}
.ex-sec-arr{font-size:10px;color:var(--ink3);transition:transform .2s}
.ex-sec-head.open .ex-sec-arr{transform:rotate(180deg)}
.ex-sec-body{display:none;background:var(--bg);border:1.5px solid var(--border);border-top:none;border-radius:0 0 var(--r-sm) var(--r-sm);padding:12px}
.ex-sec-body.open{display:block}
.list-items{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.list-item{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--card);border-radius:var(--r-xs);border:1px solid var(--border)}
.list-item-text{flex:1;font-size:12px;font-weight:600;color:var(--ink2);line-height:1.4}
.btn-rm{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink4);transition:var(--tr);flex-shrink:0}
.btn-rm:hover{background:var(--red-dim);color:var(--red)}
.add-row{display:flex;gap:6px}
.add-inp{flex:1;padding:8px 11px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-xs);color:var(--ink);font-size:12px;font-weight:600;outline:none;transition:var(--tr)}
.add-inp:focus{border-color:var(--accent)} .add-inp::placeholder{color:var(--ink4)}
.btn-add{padding:8px 13px;background:var(--accent-dim);border:1px solid rgba(245,166,35,.3);border-radius:var(--r-xs);color:#8a5e0a;font-size:12px;font-weight:800;transition:var(--tr)}
.btn-add:hover{background:var(--accent);color:#000}

/* cost grid */
.cost-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cost-field{display:flex;flex-direction:column;gap:4px}
.cost-lbl{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:1px}
.cost-inp{padding:8px 11px;background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-xs);color:var(--ink);font-size:13px;font-weight:700;outline:none;transition:var(--tr);width:100%}
.cost-inp:focus{border-color:var(--accent)}
.cost-total-box{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--accent-dim);border:1px solid rgba(245,166,35,.3);border-radius:var(--r-sm);margin-top:12px}
.cost-total-lbl{font-size:12px;font-weight:800;color:#8a5e0a;letter-spacing:1px}
.cost-total-val{font-family:var(--font-d);font-size:22px;color:#8a5e0a;letter-spacing:1px}

/* ---- SUB-CARDS pane ---- */
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:4px}
.sc-card{
  background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);
  padding:14px;position:relative;overflow:hidden;cursor:pointer;
  transition:all .25s;box-shadow:0 4px 14px rgba(0,0,0,.07),inset 0 1px 0 rgba(255,255,255,.8);
}
.sc-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:var(--r-sm) var(--r-sm) 0 0}
.sc-vocab::before{background:linear-gradient(90deg,var(--blue),#7eb3ff)}
.sc-grammar::before{background:linear-gradient(90deg,var(--red),var(--orange))}
.sc-speaking::before{background:linear-gradient(90deg,var(--green),#00e8ad)}
.sc-writing::before{background:linear-gradient(90deg,var(--orange),#ffc371)}
.sc-listening::before{background:linear-gradient(90deg,#f5a623,#ffe17d)}
.sc-reading::before{background:linear-gradient(90deg,var(--purple),#d7b8f0)}
.sc-custom::before{background:linear-gradient(90deg,var(--ink2),var(--ink3))}
.sc-card:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.11);border-color:var(--border-bright)}
.sc-card.sc-open .sc-extra{display:block}
.sc-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.sc-emo{font-size:20px;flex-shrink:0;margin-right:8px;margin-top:1px}
.sc-info{flex:1;min-width:0}
.sc-t{font-size:14px;font-weight:800;color:var(--ink);line-height:1.2;margin-bottom:2px}
.sc-d{font-size:11px;font-weight:600;color:var(--ink3);line-height:1.3}
.sc-del-btn{width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink4);transition:var(--tr);flex-shrink:0}
.sc-del-btn:hover{background:var(--red-dim);color:var(--red)}
.sc-pct-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.sc-cat-lbl{font-size:10px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:1px}
.sc-pct{font-family:var(--font-d);font-size:18px;color:var(--ink);letter-spacing:1px}
.sc-bar-bg{height:6px;background:rgba(0,0,0,.07);border-radius:3px;overflow:hidden;margin-bottom:6px;box-shadow:inset 0 1px 3px rgba(0,0,0,.08)}
.sc-bar-fill{height:100%;border-radius:3px;transition:width .4s ease}
.sc-vocab .sc-bar-fill{background:linear-gradient(90deg,var(--blue),#7eb3ff)}
.sc-grammar .sc-bar-fill{background:linear-gradient(90deg,var(--red),var(--orange))}
.sc-speaking .sc-bar-fill{background:linear-gradient(90deg,var(--green),#00e8ad)}
.sc-writing .sc-bar-fill{background:linear-gradient(90deg,var(--orange),#ffc371)}
.sc-listening .sc-bar-fill{background:linear-gradient(90deg,#f5a623,#ffe17d)}
.sc-reading .sc-bar-fill{background:linear-gradient(90deg,var(--purple),#d7b8f0)}
.sc-custom .sc-bar-fill{background:linear-gradient(90deg,var(--ink2),var(--ink3))}
.sc-slider{width:100%;-webkit-appearance:none;height:3px;border-radius:2px;background:rgba(0,0,0,.09);outline:none;cursor:pointer}
.sc-slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ink);cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.sc-slider::-webkit-slider-thumb:hover{transform:scale(1.3)}
.sc-extra{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.sc-notes-ta{width:100%;min-height:52px;padding:7px 9px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-xs);font-size:11px;font-weight:600;color:var(--ink);line-height:1.4;resize:none;outline:none;transition:var(--tr);font-family:var(--font-b)}
.sc-notes-ta:focus{border-color:var(--accent)} .sc-notes-ta::placeholder{color:var(--ink4)}
.btn-add-sc{
  display:flex;align-items:center;gap:6px;width:100%;margin-top:12px;
  padding:10px 16px;border-radius:var(--r-sm);background:transparent;
  border:1.5px dashed var(--border-bright);color:var(--ink3);font-size:13px;font-weight:800;
  transition:var(--tr);justify-content:center;
}
.btn-add-sc:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

/* ---- TIMELINE pane ---- */
.tl-wrap{position:relative;padding-left:6px}
.tl-wrap::before{content:'';position:absolute;left:16px;top:6px;bottom:0;width:2px;background:linear-gradient(180deg,var(--accent),var(--green));border-radius:1px}
.tl-item{display:flex;gap:14px;align-items:flex-start;padding-bottom:18px;position:relative;animation:tlIn .3s ease}
@keyframes tlIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;translateX(0)}}
.tl-dot{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;z-index:1;border:3px solid var(--surface);box-shadow:0 3px 12px rgba(0,0,0,.13)}
.tl-done{background:var(--green)} .tl-current{background:var(--red);animation:tlPulse 2s infinite}
.tl-upcoming{background:rgba(0,0,0,.1)}
@keyframes tlPulse{0%,100%{box-shadow:0 3px 12px rgba(255,61,107,.3)}50%{box-shadow:0 3px 22px rgba(255,61,107,.6)}}
.tl-content{flex:1;padding-top:5px}
.tl-date{font-size:10px;font-weight:800;color:var(--ink3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.tl-ttl{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:3px}
.tl-dsc{font-size:12px;font-weight:600;color:var(--ink3);line-height:1.45}
.tl-acts{display:flex;gap:6px;margin-top:7px}
.btn-tl{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:800;border:1px solid var(--border);transition:var(--tr)}
.btn-tl:hover{transform:translateY(-1px)}
.btn-tl-done{background:var(--green-dim);color:#007a5c;border-color:rgba(0,200,150,.3)}
.btn-tl-del{background:var(--red-dim);color:var(--red);border-color:rgba(255,61,107,.3)}
.btn-add-ml{
  display:flex;align-items:center;gap:6px;width:calc(100% - 48px);margin-left:48px;margin-top:4px;
  padding:9px 16px;border-radius:var(--r-sm);background:transparent;
  border:1.5px dashed var(--border-bright);color:var(--ink3);font-size:12px;font-weight:800;
  transition:var(--tr);justify-content:center;
}
.btn-add-ml:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-dim)}

/* ---- CALENDAR pane ---- */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-month-lbl{font-family:var(--font-d);font-size:24px;color:var(--ink);letter-spacing:2px}
.cal-nav-btns{display:flex;gap:6px}
.btn-cal{width:30px;height:30px;border-radius:7px;background:var(--border);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;transition:var(--tr)}
.btn-cal:hover{background:var(--accent);color:#000}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.cal-wd{text-align:center;font-size:9px;font-weight:800;color:var(--ink3);padding:4px 0;letter-spacing:.5px;text-transform:uppercase}
.cal-day{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;cursor:pointer;transition:all .2s}
.cal-day:hover:not(.cal-empty){transform:scale(1.15);z-index:5;position:relative}
.cal-empty{cursor:default}
.cd-done{background:var(--green);color:#fff;box-shadow:0 3px 10px rgba(0,200,150,.3)}
.cd-today{background:var(--red);color:#fff;box-shadow:0 3px 10px rgba(255,61,107,.3);animation:todayP 2s infinite}
@keyframes todayP{0%,100%{box-shadow:0 3px 10px rgba(255,61,107,.3)}50%{box-shadow:0 3px 20px rgba(255,61,107,.55)}}
.cd-past{color:rgba(0,0,0,.22);background:rgba(0,0,0,.04)}
.cd-future{color:var(--ink3);background:rgba(0,0,0,.03)}
.cal-legend{display:flex;gap:14px;flex-wrap:wrap}
.cl-item{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--ink3)}
.cl-dot{width:10px;height:10px;border-radius:50%}

/* streak */
.streak-row{display:flex;gap:4px;flex-wrap:wrap;margin:14px 0 10px}
.sd{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;cursor:pointer;transition:all .2s}
.sd:hover{transform:scale(1.12)}
.sd-done{background:var(--green);color:#fff;box-shadow:0 2px 8px rgba(0,200,150,.3)}
.sd-today{background:var(--red);color:#fff;animation:todayP 2s infinite}
.sd-miss{background:rgba(0,0,0,.06);color:var(--ink4)}
.sd-fut{background:rgba(0,0,0,.03);color:var(--ink4);border:1px dashed rgba(0,0,0,.12)}
.streak-stats{display:flex;gap:16px;margin-top:6px}
.ss-item{text-align:center}
.ss-val{font-family:var(--font-d);font-size:22px;color:var(--ink);letter-spacing:1px;line-height:1}
.ss-lbl{font-size:9px;font-weight:800;color:var(--ink3);letter-spacing:1px;text-transform:uppercase}

/* ---- DAILY LOG pane ---- */
.log-form{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r-sm);padding:16px;margin-bottom:16px}
.log-fr{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.log-inp,.log-sel{flex:1;min-width:110px;padding:8px 11px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-xs);color:var(--ink);font-size:13px;font-weight:700;outline:none;transition:var(--tr)}
.log-inp:focus,.log-sel:focus{border-color:var(--accent)} .log-inp::placeholder{color:var(--ink4);font-weight:600}
.log-ta{width:100%;padding:8px 11px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-xs);color:var(--ink);font-size:13px;font-weight:600;line-height:1.5;outline:none;resize:none;min-height:60px;transition:var(--tr);font-family:var(--font-b);margin-bottom:10px}
.log-ta:focus{border-color:var(--accent)}
.btn-log{display:flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--r-sm);background:var(--ink);color:#fff;font-size:13px;font-weight:800;transition:var(--tr);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-log:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}
.log-entries{display:flex;flex-direction:column;gap:8px}
.log-entry{display:flex;gap:12px;padding:11px 13px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);animation:logIn .3s ease;position:relative}
@keyframes logIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.le-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:4px}
.le-body{flex:1}
.le-topic{font-size:13px;font-weight:800;color:var(--ink)}
.le-note{font-size:12px;font-weight:600;color:var(--ink3);line-height:1.4;margin-top:2px}
.le-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.le-chip{font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;background:rgba(0,0,0,.06);color:var(--ink3)}
.le-del{position:absolute;top:9px;right:9px;width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--ink4);transition:var(--tr)}
.le-del:hover{background:var(--red-dim);color:var(--red)}

/* ============================================================
   MODALS
   ============================================================ */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(10px);z-index:500;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--card);border-radius:var(--r);padding:28px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;box-shadow:0 40px 80px rgba(0,0,0,.22),0 16px 32px rgba(0,0,0,.12);animation:modalIn .3s cubic-bezier(.34,1.56,.64,1);border-top:4px solid var(--accent)}
@keyframes modalIn{from{opacity:0;transform:scale(.93) translateY(14px)}to{opacity:1;transform:none}}
.modal-title{font-family:var(--font-d);font-size:26px;letter-spacing:2px;color:var(--ink);margin-bottom:20px}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:800;color:var(--ink3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:5px}
.fi,.fs,.ft{width:100%;padding:10px 13px;background:var(--bg);border:1.5px solid var(--border);border-radius:var(--r-xs);color:var(--ink);font-size:14px;font-weight:700;outline:none;transition:var(--tr);font-family:var(--font-b)}
.fi:focus,.fs:focus,.ft:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.ft{resize:vertical;min-height:80px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}
.btn-cancel{padding:9px 20px;border-radius:var(--r-sm);background:rgba(0,0,0,.07);color:var(--ink2);font-size:13px;font-weight:800;transition:var(--tr)}
.btn-cancel:hover{background:rgba(0,0,0,.13)}
.btn-save{padding:9px 22px;border-radius:var(--r-sm);background:var(--ink);color:#fff;font-size:13px;font-weight:800;transition:var(--tr);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.btn-save:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.2)}

/* ================================================================
   STATE
   ================================================================ */
let S={cards:[],activeTab:'business',search:'',fStatus:'',fPriority:''};
let editCardId=null, openCardId=null, openPane='overview';

function loadState(){
  try{const r=localStorage.getItem(SK);if(r)S.cards=JSON.parse(r);else{S.cards=JSON.parse(JSON.stringify(DEFS));saveState();}}
  catch(e){S.cards=JSON.parse(JSON.stringify(DEFS));}
}
function saveState(){localStorage.setItem(SK,JSON.stringify(S.cards))}
function card(id){return S.cards.find(c=>c.id===id)}

/* ================================================================
   SUMMARY
   ================================================================ */
function updateSummary(){
  const cs=S.cards, n=cs.length, wip=cs.filter(c=>c.status==='in_progress').length,
        done=cs.filter(c=>c.status==='completed').length,
        avg=n?Math.round(cs.reduce((s,c)=>s+(c.progress||0),0)/n):0;
  document.getElementById('stTotal').textContent=n;
  document.getElementById('stWip').textContent=wip;
  document.getElementById('stDone').textContent=done;
  document.getElementById('stAvg').textContent=avg+'%';
  document.getElementById('ovBar').style.width=avg+'%';
}

/* ================================================================
   TILE RENDER
   ================================================================ */
function filtered(tab){
  return S.cards.filter(c=>{
    if(c.tab!==tab)return false;
    const q=S.search.toLowerCase();
    if(q&&!c.title.toLowerCase().includes(q)&&!c.description.toLowerCase().includes(q))return false;
    if(S.fStatus&&c.status!==S.fStatus)return false;
    if(S.fPriority&&c.priority!==S.fPriority)return false;
    return true;
  });
}

function renderAll(){
  TABS.forEach(tab=>{
    const grid=document.getElementById('grid-'+tab);
    const cards=filtered(tab);
    document.getElementById('tc-'+tab).textContent=S.cards.filter(c=>c.tab===tab).length;
    if(!cards.length){
      grid.innerHTML=`<div class="empty-st"><div class="ei">🗂️</div>No cards here. Click "+ Add Card" to start.</div>`;
    } else {
      grid.innerHTML=cards.map(renderTile).join('');
      cards.forEach(c=>{initTilt(c.id);schedRing(c.id,c.progress);});
    }
  });
  updateSummary();
}

function renderTile(c){
  const circ=2*Math.PI*30, offset=circ-(c.progress/100)*circ;
  const scCount=(c.subcards||[]).length, tlCount=(c.timelines||[]).length;
  const logCount=(c.logEntries||[]).length;
  return `
  <div class="vc p-${c.priority==='high'?'high':c.priority==='medium'?'med':'low'}" id="vc-${c.id}" onclick="openDetail('${c.id}')">
    <div class="vc-strip"></div>
    <div class="vc-body">
      <div class="vc-top">
        <div class="vc-info">
          <div class="vc-title">${esc(c.title)}</div>
          <div class="vc-desc">${esc(c.description)}</div>
          <div class="vc-badges">
            <span class="bdg bs-${c.status==='not_started'?'ns':c.status==='in_progress'?'ip':'cp'}">${STLBL[c.status]}</span>
            <span class="bdg bp-${c.priority==='high'?'hi':c.priority==='medium'?'md':'lo'}">${PRLBL[c.priority]}</span>
          </div>
        </div>
        <div class="vc-ring-wrap">
          <div class="vc-ring-cont">
            <svg class="vc-ring-svg" width="68" height="68" viewBox="0 0 68 68">
              <circle class="ring-bg" cx="34" cy="34" r="30"/>
              <circle class="ring-fg" id="vcr-${c.id}" cx="34" cy="34" r="30"
                stroke="url(#rg-${c.id})" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${circ.toFixed(1)}"/>
              <defs><linearGradient id="rg-${c.id}" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="${c.priority==='high'?'#ff3d6b':c.priority==='medium'?'#f5a623':'#3d7fff'}"/>
                <stop offset="100%" stop-color="${c.priority==='high'?'#ff8c00':c.priority==='medium'?'#ffe033':'#9b7fe8'}"/>
              </linearGradient></defs>
            </svg>
            <div class="vc-ring-inner">
              <div class="vc-ring-pct" id="vcrp-${c.id}">${c.progress}%</div>
              <div class="vc-ring-lbl">Done</div>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="vc-bar-row">
          <span class="vc-bar-lbl">Progress</span>
          <span class="vc-bar-val">${c.progress}%</span>
        </div>
        <div class="vc-bar-bg"><div class="vc-bar-fill" style="width:${c.progress}%"></div></div>
      </div>
      <div class="vc-footer">
        <div class="vc-meta-chips">
          ${scCount?`<span class="vc-chip">🃏 ${scCount} sub-cards</span>`:''}
          ${tlCount?`<span class="vc-chip">🗺️ ${tlCount} milestones</span>`:''}
          ${logCount?`<span class="vc-chip">📝 ${logCount} logs</span>`:''}

        <button class="vc-open-btn" onclick="event.stopPropagation();openDetail('${c.id}')">Open →</button>
      </div>
    </div>
  </div>`;
}

function initTilt(id){
  const el=document.getElementById('vc-'+id); if(!el)return;
  el.addEventListener('mousemove',e=>{
    const r=el.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    el.style.transform=`rotateX(${y*-6}deg) rotateY(${x*6}deg) translateY(-5px)`;
  });
  el.addEventListener('mouseleave',()=>el.style.transform='');
}
function schedRing(id,pct){
  setTimeout(()=>{
    const el=document.getElementById('vcr-'+id); if(!el)return;
    const circ=2*Math.PI*30;
    el.style.strokeDashoffset=(circ-(pct/100)*circ).toFixed(1);
  },200);
}

/* ================================================================
   DETAIL PANEL
   ================================================================ */
function openDetail(id){
  openCardId=id; openPane='overview';
  const c=card(id); if(!c)return;
  document.getElementById('dpTitle').textContent=c.title;
  document.getElementById('dpSub').textContent=`${STLBL[c.status]} · ${PRLBL[c.priority]} Priority · ${c.tab.charAt(0).toUpperCase()+c.tab.slice(1)}`;
  document.getElementById('dpEditBtn').onclick=()=>editCard(id);
  document.getElementById('dpDelBtn').onclick=()=>deleteCard(id);
  document.getElementById('dpOverlay').classList.add('open');
  document.getElementById('dp').classList.add('open');
  switchPane('overview');
}
function closeDetail(){
  document.getElementById('dpOverlay').classList.remove('open');
  document.getElementById('dp').classList.remove('open');
  openCardId=null;
}

function switchPane(pane){
  openPane=pane;
  document.querySelectorAll('.dp-tab').forEach(t=>t.classList.toggle('act',t.dataset.pane===pane));
  const body=document.getElementById('dpBody');
  const c=card(openCardId); if(!c)return;
  body.innerHTML='';
  const el=document.createElement('div');
  el.className='dp-pane act';
  el.innerHTML=buildPane(c,pane);
  body.appendChild(el);
  // post-render
  if(pane==='overview'){
    setTimeout(()=>{
      const r=document.getElementById('dpRing'); if(!r)return;
      const circ=2*Math.PI*44;
      r.style.strokeDashoffset=(circ-(c.progress/100)*circ).toFixed(1);
    },100);
    bindOverviewEvents(c);
  }
  if(pane==='execution') bindExEvents(c);
  if(pane==='subcards') bindScEvents(c);
  if(pane==='calendar') renderCal(c);
  if(pane==='log') bindLogEvents(c);
}

/* ---- OVERVIEW pane ---- */
function buildPane(c,pane){
  if(pane==='overview') return buildOverview(c);
  if(pane==='execution') return buildExecution(c);
  if(pane==='subcards') return buildSubcards(c);
  if(pane==='timeline') return buildTimeline(c);
  if(pane==='calendar') return buildCalendar(c);
  if(pane==='log') return buildLog(c);
  return '';
}

function bindOverviewEvents(c){
  const sl=document.getElementById('dpSlider'); if(!sl)return;
  sl.oninput=function(){
    const v=parseInt(this.value);
    document.getElementById('dpProgVal').textContent=v+'%';
    document.getElementById('dpProgBar').style.width=v+'%';
    document.getElementById('dpRingPct').textContent=v+'%';
    const r=document.getElementById('dpRing'),circ=2*Math.PI*44;
    if(r)r.style.strokeDashoffset=(circ-(v/100)*circ).toFixed(1);
    // update tile too
    const vb=document.querySelector(`#vc-${c.id} .vc-bar-fill`);
    if(vb)vb.style.width=v+'%';
    const vr=document.getElementById('vcr-'+c.id);
    if(vr){const c2=2*Math.PI*30;vr.style.strokeDashoffset=(c2-(v/100)*c2).toFixed(1);}
    const vp=document.getElementById('vcrp-'+c.id); if(vp)vp.textContent=v+'%';
    updateCardField('progress',v,true);
  };
}
function updateCardField(field,val,silent){
  const c=card(openCardId); if(!c)return;
  c[field]=val; saveState();
  if(!silent)updateSummary();
  if(field==='progress')updateSummary();
}

      <div class="ex-sec-head" id="exh-${c.id}-${s.k}" onclick="toggleEx('${c.id}','${s.k}')">
        <div class="ex-sec-left">
          <span class="ex-sec-ico">${s.i}</span>

        </div>
        <span class="ex-sec-arr">▼</span>
      </div>
      <div class="ex-sec-body" id="exb-${c.id}-${s.k}">
        <div class="list-items" id="elist-${c.id}-${s.k}">
          ${items.map((it,i)=>`<div class="list-item"><span class="list-item-text">${esc(it)}</span><button class="btn-rm" data-c="${c.id}" data-s="${s.k}" data-i="${i}">✕</button></div>`).join('')}

  }).join('');

  return `
  ${sections}
  <div class="ex-section" style="margin-top:8px">
    <div class="ex-sec-head" id="exh-${c.id}-cost" onclick="toggleEx('${c.id}','cost')">

      <span class="ex-sec-arr">▼</span>

function toggleEx(cid,key){
  const h=document.getElementById(`exh-${cid}-${key}`), b=document.getElementById(`exb-${cid}-${key}`);
  if(!h||!b)return;
  h.classList.toggle('open'); b.classList.toggle('open');
}
function bindExEvents(c){
  document.querySelectorAll('.btn-rm').forEach(b=>{
    b.onclick=()=>removeExItem(b.dataset.c,b.dataset.s,parseInt(b.dataset.i));
  });
}
function addExItem(cid,skey){
  const inp=document.getElementById(`einp-${cid}-${skey}`); if(!inp||!inp.value.trim())return;
  const c=card(cid); if(!c)return;
  c.sections[skey].push(inp.value.trim()); inp.value=''; saveState();
  refreshExList(c,skey);
}
function removeExItem(cid,skey,idx){
  const c=card(cid); if(!c)return;
  c.sections[skey].splice(idx,1); saveState();
  refreshExList(c,skey);
}
function refreshExList(c,skey){
  const el=document.getElementById(`elist-${c.id}-${skey}`); if(!el)return;
  el.innerHTML=c.sections[skey].map((it,i)=>`<div class="list-item"><span class="list-item-text">${esc(it)}</span><button class="btn-rm" data-c="${c.id}" data-s="${skey}" data-i="${i}">✕</button></div>`).join('');
  bindExEvents(c);
}
function updateCost(field,val){
  const c=card(openCardId); if(!c)return;
  c.costs[field]=parseInt(val)||0;
  const tc=(c.costs.dev||0)+(c.costs.marketing||0)+(c.costs.infra||0)+(c.costs.misc||0);
  const el=document.getElementById('ctotal-dp'); if(el)el.textContent=fmt(tc);
  saveState();
}

  return `

function bindScEvents(c){
  document.querySelectorAll('.sc-slider').forEach(sl=>{
    sl.oninput=function(e){
      e.stopPropagation();
      const {cid,sid}=this.dataset, val=parseInt(this.value);
      const cv=card(cid); if(!cv)return;
      const sc=(cv.subcards||[]).find(s=>s.id===sid); if(sc)sc.progress=val;
      const pb=document.getElementById('sbar-'+sid), pv=document.getElementById('spct-'+sid);
      if(pb)pb.style.width=val+'%'; if(pv)pv.textContent=val+'%';
      saveState();
    };
  });
}
function toggleSc(sid,e){
  if(e.target.closest('.sc-del-btn')||e.target.closest('.sc-slider')||e.target.closest('.sc-notes-ta'))return;
  const el=document.getElementById('scc-'+sid); if(el)el.classList.toggle('sc-open');
}
function delSc(cid,sid,e){
  e.stopPropagation();
  if(!confirm('Delete sub-card?'))return;
  const c=card(cid); if(!c)return;
  c.subcards=(c.subcards||[]).filter(s=>s.id!==sid); saveState();
  switchPane('subcards'); toast('Sub-card deleted');

function markMlDone(cid,mid){
  const c=card(cid); if(!c)return;
  const m=(c.timelines||[]).find(t=>t.id===mid); if(!m)return;
  const prev=m.status;

  pushUndo({type:'ml_status',cid,mid,prev,next:'done',label:`"${m.title}" marked done`});
  switchPane('timeline'); toast('🏆 Milestone done!');
}
function restoreMl(cid,mid,toStatus){
  const c=card(cid); if(!c)return;
  const m=(c.timelines||[]).find(t=>t.id===mid); if(!m)return;
  const prev=m.status;
  m.status=toStatus; saveState();
  pushUndo({type:'ml_status',cid,mid,prev,next:toStatus,label:`"${m.title}" restored to ${toStatus}`});
  switchPane('timeline'); toast('↩ Milestone restored!');
}
function setMlStatus(cid,mid,status){
  if(!status)return;
  const c=card(cid); if(!c)return;
  const m=(c.timelines||[]).find(t=>t.id===mid); if(!m)return;
  const prev=m.status; m.status=status; saveState();
  pushUndo({type:'ml_status',cid,mid,prev,next:status,label:`"${m.title}" → ${status}`});
  switchPane('timeline'); toast('Status updated');
}
function delMl(cid,mid){
  if(!adminUnlocked()){openPinModal();return;}
  const c=card(cid); if(!c)return;
  const m=(c.timelines||[]).find(t=>t.id===mid); if(!m)return;
  const snapshot=JSON.parse(JSON.stringify(m));
  c.timelines=(c.timelines||[]).filter(t=>t.id!==mid); saveState();
  pushUndo({type:'ml_delete',cid,snapshot,label:`"${m.title}" deleted`});
  switchPane('timeline'); toast('Milestone removed');

/* ---- CALENDAR pane ---- */
function buildCalendar(c){
  return `<div id="calWrap"></div>
  <div class="sec-lbl" style="margin-top:20px">🔥 Study Streak</div>
  <div class="streak-row" id="streakRow"></div>
  <div class="streak-stats" id="streakStats"></div>`;
}
function renderCal(c){
  const calEl=document.getElementById('calWrap'); if(!calEl)return;
  const yr=c.calYear||2026, mo=c.calMonth!==undefined?c.calMonth:3;
  const MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  const first=new Date(yr,mo,1).getDay(), off=first===0?6:first-1;
  const days=new Date(yr,mo+1,0).getDate(), td=today(), studied=c.studiedDays||[];
  let html=`<div class="cal-nav">
    <div class="cal-month-lbl">${MONTHS[mo]} ${yr}</div>
    <div class="cal-nav-btns">
      <button class="btn-cal" onclick="chMo(-1)">←</button>
      <button class="btn-cal" onclick="chMo(1)">→</button>
    </div>
  </div>
  <div class="cal-grid">
    <div class="cal-wd">Mo</div><div class="cal-wd">Tu</div><div class="cal-wd">We</div>
    <div class="cal-wd">Th</div><div class="cal-wd">Fr</div><div class="cal-wd">Sa</div><div class="cal-wd">Su</div>`;
  for(let i=0;i<off;i++)html+=`<div class="cal-day cal-empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isT=k===td, isD=studied.includes(k), isP=k<td;
    let cls='cal-day ';
    if(isT)cls+=isD?'cd-done cd-today':'cd-today';
    else if(isD)cls+='cd-done';
    else if(isP)cls+='cd-past';
    else cls+='cd-future';
    html+=`<div class="${cls}" onclick="togStudy('${k}')">${d}</div>`;
  }
  html+=`</div>
  <div class="cal-legend">
    <div class="cl-item"><div class="cl-dot" style="background:var(--green)"></div>Studied</div>
    <div class="cl-item"><div class="cl-dot" style="background:var(--red)"></div>Today</div>
    <div class="cl-item"><div class="cl-dot" style="background:rgba(0,0,0,0.1)"></div>Missed</div>
  </div>`;
  calEl.innerHTML=html;
  renderStreak(c);
}
function chMo(dir){
  const c=card(openCardId); if(!c)return;
  c.calMonth=(c.calMonth||3)+dir;
  if(c.calMonth>11){c.calMonth=0;c.calYear=(c.calYear||2026)+1;}
  if(c.calMonth<0){c.calMonth=11;c.calYear=(c.calYear||2026)-1;}
  saveState(); renderCal(c);
}
function togStudy(k){
  const c=card(openCardId); if(!c)return;
  c.studiedDays=c.studiedDays||[];
  const i=c.studiedDays.indexOf(k);
  if(i>=0)c.studiedDays.splice(i,1);else c.studiedDays.push(k);
  saveState(); renderCal(c);
  toast(i>=0?'Day unmarked':'✅ Marked as studied!');
}
function renderStreak(c){
  const sr=document.getElementById('streakRow'),ss=document.getElementById('streakStats');
  if(!sr)return;
  const td2=today(), now=new Date(), yr=now.getFullYear(), mo=now.getMonth();
  const days=new Date(yr,mo+1,0).getDate(), studied=c.studiedDays||[];
  let html='';
  for(let d=1;d<=days;d++){
    const k=`${yr}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isT=k===td2,isD=studied.includes(k),isP=k<td2;
    let cls='sd ';
    if(isT)cls+=isD?'sd-done':'sd-today';
    else if(isD)cls+='sd-done';
    else if(isP)cls+='sd-miss';
    else cls+='sd-fut';
    html+=`<div class="${cls}" onclick="togStudy('${k}')" title="${k}">${d}</div>`;
  }
  sr.innerHTML=html;
  let streak=0,d2=new Date();
  while(true){const k=dkey(d2);if(studied.includes(k)){streak++;d2.setDate(d2.getDate()-1);}else break;}
  const mo2=String(mo+1).padStart(2,'0');
  const doneM=studied.filter(d=>d.startsWith(`${yr}-${mo2}`)).length;
  const todayLogs=(c.logEntries||[]).filter(e=>dkey(new Date(e.ts))===td2);
  const totalMin=todayLogs.reduce((s,e)=>s+(e.minutes||0),0);
  if(ss)ss.innerHTML=`
    <div class="ss-item"><div class="ss-val">${streak}🔥</div><div class="ss-lbl">Streak</div></div>
    <div class="ss-item"><div class="ss-val">${doneM}</div><div class="ss-lbl">This Month</div></div>
    <div class="ss-item"><div class="ss-val">${totalMin}</div><div class="ss-lbl">Min Today</div></div>`;
}

function addLog(cid){
  const topic=document.getElementById('logTopic')?.value.trim();
  if(!topic){toast('Topic required','err');return;}
  const c=card(cid); if(!c)return;
  c.logEntries=c.logEntries||[];

/* ================================================================
   ADMIN PIN SYSTEM
   ================================================================ */
const ADMIN_PIN_KEY='vd_admin_pin';
const DEFAULT_PIN='1234';
let _pinBuffer='';
let _adminSession=false; // session-level unlock (lost on refresh)

function adminUnlocked(){return _adminSession;}

function openPinModal(){
  _pinBuffer='';
  document.getElementById('pinErr').textContent='';
  document.getElementById('pinSub').textContent=
    _adminSession
      ? 'You are currently unlocked. Enter PIN to lock.'
      : 'Enter your 4-digit PIN to unlock admin features';
  document.getElementById('pinHint').textContent=
    'Default PIN: 1234  ·  Change after unlock via Export/settings';
  updatePinDots();
  document.getElementById('pinModal').classList.add('open');
}
function closePinModal(){document.getElementById('pinModal').classList.remove('open');_pinBuffer='';}
function pinKey(d){
  if(_pinBuffer.length>=4)return;
  _pinBuffer+=d;
  updatePinDots();
  if(_pinBuffer.length===4)setTimeout(checkPin,120);
}
function pinDelete(){_pinBuffer=_pinBuffer.slice(0,-1);updatePinDots();}
function pinClear(){_pinBuffer='';updatePinDots();}
function updatePinDots(){
  for(let i=0;i<4;i++){
    const d=document.getElementById('pd'+i);
    if(!d)continue;
    d.classList.toggle('filled',i<_pinBuffer.length);
    d.classList.remove('err');
  }
}
function checkPin(){
  const stored=localStorage.getItem(ADMIN_PIN_KEY)||DEFAULT_PIN;
  if(_pinBuffer===stored){
    if(_adminSession){
      // already unlocked → lock
      _adminSession=false;
      updateAdminBadge();
      closePinModal();
      toast('🔒 Admin locked');
    } else {
      _adminSession=true;
      updateAdminBadge();
      closePinModal();
      toast('🔓 Admin unlocked!');
      // refresh open pane to show admin controls
      if(openCardId) switchPane(openPane);
    }
  } else {
    // wrong PIN — shake dots
    for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d)d.classList.add('err');}
    document.getElementById('pinErr').textContent='Incorrect PIN. Try again.';
    setTimeout(()=>{_pinBuffer='';updatePinDots();document.getElementById('pinErr').textContent='';},900);
  }
}
function updateAdminBadge(){
  const b=document.getElementById('adminBadge');
  const l=document.getElementById('adminLabel');
  if(!b)return;
  if(_adminSession){b.className='admin-badge unlocked';if(l)l.textContent='Admin ✓';}
  else{b.className='admin-badge locked';if(l)l.textContent='Admin';}
}
document.getElementById('adminBadge').addEventListener('click',openPinModal);
document.getElementById('pinModal').addEventListener('click',e=>{if(e.target===e.currentTarget)closePinModal();});
// keyboard PIN entry
document.addEventListener('keydown',e=>{
  if(!document.getElementById('pinModal').classList.contains('open'))return;
  if(e.key>='0'&&e.key<='9')pinKey(e.key);
  else if(e.key==='Backspace')pinDelete();
  else if(e.key==='Escape')closePinModal();
});

/* ================================================================
   UNDO SYSTEM  (single-action undo)
   ================================================================ */
let _undoStack=null; // one slot
let _undoTimer=null;

function pushUndo(action){
  _undoStack=action;
  clearTimeout(_undoTimer);
  document.getElementById('undoMsg').textContent=action.label;
  document.getElementById('undoBar').classList.add('show');
  _undoTimer=setTimeout(dismissUndo,6000);
}
function dismissUndo(){
  clearTimeout(_undoTimer);
  document.getElementById('undoBar').classList.remove('show');
  setTimeout(()=>{_undoStack=null;},400);
}
function doUndo(){
  if(!_undoStack)return;
  const a=_undoStack;
  dismissUndo();
  if(a.type==='ml_status'){
    const c=card(a.cid); if(!c)return;
    const m=(c.timelines||[]).find(t=>t.id===a.mid);
    if(m){m.status=a.prev;saveState();}
    if(openCardId===a.cid) switchPane('timeline');
    toast('↩ Undone — status restored');
  }
  if(a.type==='ml_delete'){
    const c=card(a.cid); if(!c)return;
    c.timelines=c.timelines||[];
    c.timelines.push(a.snapshot); saveState();
    if(openCardId===a.cid) switchPane('timeline');
    toast('↩ Milestone restored!');
  }
}

/* ================================================================
   INIT
   ================================================================ */
loadState();
renderAll();
</script>
